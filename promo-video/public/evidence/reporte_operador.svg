<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <title>Ilustración: plano de la terminal con un marcador en el punto reportado por el operador (imagen ilustrativa, sin datos personales)</title>
  <rect width="320" height="180" fill="#10264a"/>
  <!-- Retícula del plano -->
  <g stroke="#1d3b6e" stroke-width="1">
    <path d="M0 30 H320"/><path d="M0 60 H320"/><path d="M0 90 H320"/><path d="M0 120 H320"/><path d="M0 150 H320"/>
    <path d="M40 0 V180"/><path d="M80 0 V180"/><path d="M120 0 V180"/><path d="M160 0 V180"/>
    <path d="M200 0 V180"/><path d="M240 0 V180"/><path d="M280 0 V180"/>
  </g>
  <!-- Zonas del plano -->
  <g fill="#284b85" stroke="#4a6fa8" stroke-width="1.2">
    <rect x="20" y="16" width="280" height="26" rx="2"/>
    <rect x="30" y="52" width="90" height="40" rx="2"/>
    <rect x="130" y="52" width="80" height="58" rx="2"/>
    <rect x="220" y="52" width="80" height="40" rx="2"/>
    <rect x="30" y="102" width="90" height="34" rx="2"/>
    <rect x="220" y="102" width="80" height="34" rx="2"/>
    <rect x="70" y="146" width="180" height="24" rx="2"/>
  </g>
  <!-- Zona del punto reportado -->
  <rect x="130" y="52" width="80" height="58" rx="2" fill="#1d5fd1" opacity="0.35"/>
  <!-- Marcador (punto reportado) -->
  <ellipse cx="172" cy="100" rx="14" ry="4.5" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="172" cy="100" rx="7" ry="2.2" fill="#f8fafc" opacity="0.5"/>
  <path d="M172 99 C 164 86, 160 80, 160 72 A 12 12 0 1 1 184 72 C 184 80, 180 86, 172 99 Z" fill="#f59e0b" stroke="#0b1b33" stroke-width="1.5"/>
  <circle cx="172" cy="71" r="4.5" fill="#0b1b33"/>
  <!-- Radio de operador (reporte humano) -->
  <g transform="translate(26 140)">
    <rect x="0" y="6" width="18" height="30" rx="3" fill="#94a3b8"/>
    <rect x="3" y="10" width="12" height="9" rx="1" fill="#0b1b33"/>
    <rect x="12" y="-4" width="3" height="10" rx="1" fill="#94a3b8"/>
    <circle cx="9" cy="27" r="4" fill="#475569"/>
    <path d="M24 10 q6 6 0 12 M29 6 q10 10 0 20" stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
