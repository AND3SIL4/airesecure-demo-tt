<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <title>Ilustración: pasillo con una caja sin identificar junto a una columna (imagen ilustrativa, sin datos personales)</title>
  <rect width="320" height="180" fill="#e2e8f0"/>
  <rect width="320" height="14" fill="#cbd5e1"/>
  <rect x="40" y="5" width="40" height="3" rx="1.5" fill="#f8fafc"/>
  <rect x="160" y="5" width="40" height="3" rx="1.5" fill="#f8fafc"/>
  <rect x="270" y="5" width="40" height="3" rx="1.5" fill="#f8fafc"/>
  <!-- Señalética -->
  <rect x="120" y="24" width="90" height="18" rx="2" fill="#10264a"/>
  <rect x="128" y="31" width="44" height="4" rx="2" fill="#f8fafc"/>
  <path d="M188 33 h12 m-5 -5 l5 5 l-5 5" stroke="#f8fafc" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Arco de seguridad al fondo -->
  <rect x="226" y="40" width="8" height="70" fill="#64748b"/>
  <rect x="272" y="40" width="8" height="70" fill="#64748b"/>
  <rect x="226" y="36" width="54" height="8" rx="2" fill="#475569"/>
  <rect x="240" y="96" width="70" height="10" rx="2" fill="#94a3b8"/>
  <!-- Suelo -->
  <path d="M0 110 H320 V180 H0 Z" fill="#b8c4d3"/>
  <path d="M0 110 H320" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#a7b4c5" stroke-width="1">
    <path d="M60 110 L20 180"/><path d="M140 110 L130 180"/><path d="M220 110 L240 180"/>
    <path d="M300 110 L340 180"/><path d="M0 135 H320"/><path d="M0 160 H320"/>
  </g>
  <!-- Columna -->
  <rect x="70" y="14" width="22" height="140" fill="#cbd5e1"/>
  <rect x="70" y="14" width="6" height="140" fill="#dbe3ec"/>
  <rect x="66" y="150" width="30" height="6" fill="#94a3b8"/>
  <!-- Caja sin identificar (objeto detectado) -->
  <path d="M122 132 L130 126 L166 126 L158 132 Z" fill="#b59a76"/>
  <path d="M158 132 L166 126 L166 150 L158 156 Z" fill="#8a7255"/>
  <rect x="122" y="132" width="36" height="24" fill="#a3896b"/>
  <rect x="138" y="132" width="4" height="24" fill="#d6c7ad"/>
  <rect x="126" y="138" width="9" height="6" fill="#f1f5f9"/>
  <ellipse cx="144" cy="158" rx="24" ry="2.5" fill="#64748b" opacity="0.35"/>
</svg>
