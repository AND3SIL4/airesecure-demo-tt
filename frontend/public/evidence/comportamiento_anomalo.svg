<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <title>Ilustración: vestíbulo con una trayectoria de movimiento irregular marcada en el suelo (imagen ilustrativa, sin datos personales)</title>
  <rect width="320" height="180" fill="#e2e8f0"/>
  <rect width="320" height="14" fill="#cbd5e1"/>
  <rect x="30" y="5" width="40" height="3" rx="1.5" fill="#f8fafc"/>
  <rect x="140" y="5" width="40" height="3" rx="1.5" fill="#f8fafc"/>
  <rect x="250" y="5" width="40" height="3" rx="1.5" fill="#f8fafc"/>
  <!-- Mostradores de migración al fondo -->
  <g fill="#94a3b8">
    <rect x="20" y="70" width="44" height="28" rx="2"/>
    <rect x="256" y="70" width="44" height="28" rx="2"/>
  </g>
  <g fill="#10264a">
    <rect x="20" y="62" width="44" height="8" rx="2"/>
    <rect x="256" y="62" width="44" height="8" rx="2"/>
  </g>
  <rect x="110" y="26" width="100" height="18" rx="2" fill="#10264a"/>
  <rect x="120" y="33" width="80" height="4" rx="2" fill="#f8fafc"/>
  <!-- Columnas -->
  <rect x="84" y="14" width="14" height="88" fill="#cbd5e1"/>
  <rect x="222" y="14" width="14" height="88" fill="#cbd5e1"/>
  <!-- Suelo -->
  <path d="M0 100 H320 V180 H0 Z" fill="#b8c4d3"/>
  <path d="M0 100 H320" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#a7b4c5" stroke-width="1">
    <path d="M50 100 L0 165"/><path d="M120 100 L95 180"/><path d="M200 100 L225 180"/>
    <path d="M270 100 L320 165"/><path d="M0 125 H320"/><path d="M0 152 H320"/>
  </g>
  <!-- Trayectoria irregular (patrón detectado): marcas abstractas, sin personas -->
  <path d="M110 162 C 128 118, 150 172, 166 134 S 206 112, 198 148 S 150 156, 172 126 S 214 116, 224 120"
        fill="none" stroke="#1d5fd1" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <g fill="#1d5fd1">
    <circle cx="110" cy="162" r="3.5" fill="#f8fafc" stroke="#1d5fd1" stroke-width="2"/>
    <circle cx="166" cy="134" r="2.2"/>
    <circle cx="198" cy="148" r="2.2"/>
    <circle cx="172" cy="126" r="2.2"/>
  </g>
  <circle cx="224" cy="120" r="5" fill="#1d5fd1"/>
  <circle cx="224" cy="120" r="9" fill="none" stroke="#1d5fd1" stroke-width="1.5" opacity="0.5"/>
</svg>
