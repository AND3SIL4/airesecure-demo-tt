<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <title>Ilustración: zona comercial con un área de permanencia prolongada marcada en el suelo (imagen ilustrativa, sin datos personales)</title>
  <rect width="320" height="180" fill="#e2e8f0"/>
  <rect width="320" height="14" fill="#cbd5e1"/>
  <rect x="30" y="5" width="40" height="3" rx="1.5" fill="#f8fafc"/>
  <rect x="140" y="5" width="40" height="3" rx="1.5" fill="#f8fafc"/>
  <rect x="250" y="5" width="40" height="3" rx="1.5" fill="#f8fafc"/>
  <!-- Fachadas de tiendas -->
  <g>
    <rect x="10" y="30" width="90" height="66" fill="#cbd5e1"/>
    <rect x="10" y="30" width="90" height="12" fill="#10264a"/>
    <rect x="18" y="48" width="74" height="40" fill="#f1f5f9"/>
    <rect x="24" y="66" width="20" height="22" fill="#94a3b8"/>
    <rect x="52" y="60" width="34" height="8" fill="#94a3b8"/>
  </g>
  <g>
    <rect x="115" y="30" width="90" height="66" fill="#cbd5e1"/>
    <rect x="115" y="30" width="90" height="12" fill="#1d5fd1"/>
    <rect x="123" y="48" width="74" height="40" fill="#f1f5f9"/>
    <rect x="130" y="56" width="26" height="6" fill="#94a3b8"/>
    <rect x="164" y="56" width="26" height="6" fill="#94a3b8"/>
    <rect x="130" y="70" width="60" height="6" fill="#94a3b8"/>
  </g>
  <g>
    <rect x="220" y="30" width="90" height="66" fill="#cbd5e1"/>
    <rect x="220" y="30" width="90" height="12" fill="#475569"/>
    <rect x="228" y="48" width="74" height="40" fill="#f1f5f9"/>
    <rect x="236" y="62" width="58" height="10" fill="#94a3b8"/>
  </g>
  <!-- Suelo -->
  <path d="M0 98 H320 V180 H0 Z" fill="#b8c4d3"/>
  <path d="M0 98 H320" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#a7b4c5" stroke-width="1">
    <path d="M50 98 L10 180"/><path d="M160 98 L160 180"/><path d="M270 98 L310 180"/>
    <path d="M0 124 H320"/><path d="M0 152 H320"/>
  </g>
  <!-- Macetero -->
  <rect x="236" y="128" width="24" height="20" rx="2" fill="#64748b"/>
  <circle cx="248" cy="120" r="12" fill="#94a3b8"/>
  <!-- Área de permanencia prolongada (patrón detectado) -->
  <ellipse cx="105" cy="146" rx="30" ry="11" fill="#1d5fd1" opacity="0.15"/>
  <ellipse cx="105" cy="146" rx="30" ry="11" fill="none" stroke="#1d5fd1" stroke-width="2" stroke-dasharray="5 3"/>
  <ellipse cx="105" cy="146" rx="16" ry="6" fill="none" stroke="#1d5fd1" stroke-width="1.5" opacity="0.7"/>
  <circle cx="105" cy="146" r="3" fill="#1d5fd1"/>
  <!-- Indicador de tiempo -->
  <circle cx="105" cy="119" r="11" fill="#f8fafc" stroke="#10264a" stroke-width="2"/>
  <path d="M105 112 V119 L110 122" stroke="#10264a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M105 130 V136" stroke="#10264a" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
